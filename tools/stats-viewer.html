<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silinium Stats Viewer</title>
<!--
Shows a Silinium stats file (Save Stats, /dev_hdd0/tmp/Silinium/stats/<name>.bin) in the
browser. The file never leaves the page. The DDL layout at the end is a verbatim copy of
data/mp/stats_ddl.txt from bo1-re; re-paste it there when the layout changes.
-->
<style>
:root {
  --bg: #0d0f12;
  --panel: #15181d;
  --panel-2: #1b1f26;
  --line: #262b33;
  --text: #e6e3dc;
  --muted: #8b9099;
  --accent: #e8a33d;
  --accent-dim: #e8a33d33;
  --good: #6cc070;
  --bad: #e0614f;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
body { min-height: 100vh; }
a { color: var(--accent); }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px; border-bottom: 1px solid var(--line); background: #0b0d10;
  position: sticky; top: 0; z-index: 5;
}
.brand { font: 600 13px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
.brand b { color: var(--accent); }
.btn {
  font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--bg); background: var(--accent); border: 0; padding: 9px 14px; border-radius: 3px;
  cursor: pointer;
}
.btn:hover { filter: brightness(1.1); }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }

#drop {
  margin: 8vh auto 0; max-width: 560px; padding: 56px 24px; text-align: center;
  border: 1.5px dashed var(--line); border-radius: 6px; background: var(--panel);
  transition: border-color .15s, background .15s;
}
#drop.over { border-color: var(--accent); background: var(--accent-dim); }
#drop h1 { margin: 0 0 8px; font-size: 20px; }
#drop p { margin: 0 0 20px; color: var(--muted); }
.error {
  margin: 16px auto 0; max-width: 560px; padding: 12px 14px; border-left: 3px solid var(--bad);
  background: #2a1614; color: #f2b8ae; font-family: var(--mono); font-size: 12px;
}

.hero {
  display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
  padding: 24px; background: linear-gradient(135deg, #1d1a14, var(--panel) 55%);
  border: 1px solid var(--line); border-radius: 6px;
}
.emblem {
  width: 84px; height: 84px; display: grid; place-items: center; border-radius: 50%;
  border: 2px solid var(--accent); color: var(--accent); background: #0b0d10;
  font: 700 30px/1 var(--mono); text-align: center;
}
.emblem small { display: block; font-size: 9px; letter-spacing: .2em; color: var(--muted); margin: 4px -.2em 0 0; }
.hero h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .01em; word-break: break-word; }
.hero h2 .clan { color: var(--accent); font-family: var(--mono); font-weight: 600; margin-right: 6px; }
.hero .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 3px; border: 1px solid var(--line);
  color: var(--muted); background: #0b0d10;
}
.chip.ok { color: var(--good); border-color: #2e4a30; }
.chip.warn { color: var(--bad); border-color: #4d2a25; }
.hero .figures { display: flex; gap: 28px; text-align: right; }
.fig .k { font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.fig .v { font: 700 22px/1.2 var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }

section { margin-top: 32px; }
section > h3 {
  margin: 0 0 12px; font: 600 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 10px;
}
section > h3::before { content: ""; width: 14px; height: 2px; background: var(--accent); }
section > h3 .note { text-transform: none; letter-spacing: 0; font-family: var(--sans); font-weight: 400; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font: 700 22px/1.25 var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .s { color: var(--muted); font: 11px/1.3 var(--mono); margin-top: 2px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th {
  font: 600 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
  background: var(--panel-2); position: sticky; top: 0;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted { color: var(--accent); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #1a1e24; }
td.mono, .mono { font-family: var(--mono); font-size: 12px; }
td.dim { color: var(--muted); }
td.barcell { width: 30%; padding-right: 16px; }
td.barcell div { height: 6px; background: var(--accent); border-radius: 1px; opacity: .85; }

.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.class { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.class .slot { font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.class .name { font: 600 16px/1.3 var(--mono); margin: 6px 0 8px; color: var(--accent); word-break: break-word; }
.class dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font: 11px/1.5 var(--mono); }
.class dt { color: var(--muted); white-space: nowrap; }
.class dd { margin: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.toolbar { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
input[type=search] {
  flex: 1; min-width: 180px; background: #0b0d10; border: 1px solid var(--line); color: var(--text);
  padding: 8px 10px; border-radius: 3px; font: 13px var(--mono);
}
input[type=search]:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
label.check { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.tall { max-height: 520px; overflow: auto; }
.count { color: var(--muted); font: 11px var(--mono); }
.footnote { color: var(--muted); font-size: 12px; margin-top: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

@media (max-width: 760px) {
  header.top { padding: 12px 16px; }
  .hero { grid-template-columns: auto 1fr; }
  .hero .figures { grid-column: 1 / -1; justify-content: space-between; text-align: left; gap: 12px; }
  .two { grid-template-columns: 1fr; }
  td.barcell { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Silinium</b> Stats Viewer</div>
  <button class="btn" id="open">Open .bin</button>
  <input type="file" id="file" accept=".bin" hidden>
</header>
<main>
  <div id="drop">
    <h1>Drop a stats file here</h1>
    <p>A file from Save Stats: <span class="mono">/dev_hdd0/tmp/Silinium/stats/&lt;name&gt;.bin</span>.<br>
      It is read locally and never uploaded.</p>
    <button class="btn" id="open2">Choose file</button>
  </div>
  <div id="error" class="error" hidden></div>
  <div id="out"></div>
</main>

// --- DDL ------------------------------------------------------------------------------

// fields: path -> {bit, bits, element, type, array, enum}; children: path -> [paths]
function parseDdl(text) {
  const fields = new Map();
  const children = new Map();
  const enums = [];
  let currentEnum = null;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line) {
      continue;
    }
    let m = line.match(/^enum (\d+) (\S+) count=(\d+)/);
    if (m) {
      currentEnum = enums[+m[1]] = { name: m[2], names: [] };
      continue;
    }
    m = line.match(/^\s+(\d+) (\S+)$/);
    if (m && currentEnum) {
      currentEnum.names[+m[1]] = m[2];
      continue;
    }
    m = line.match(/^(\S+) byte=0x([0-9A-F]+) bit=(\d+) bits=(\d+) element=(\d+) type=(\d+) array=(\d+) enum=(-?\d+)/i);
    if (!m) {
      continue;
    }
    const path = m[1];
    fields.set(path, {
      path, bit: parseInt(m[2], 16) * 8 + +m[3], bits: +m[4], element: +m[5],
      type: +m[6], array: +m[7], enum: +m[8],
    });
    const parent = path.slice(0, path.lastIndexOf("."));
    if (!children.has(parent)) {
      children.set(parent, []);
    }
    children.get(parent).push(path);
  }
  return { fields, children, enums };
}

// Index names of an array field. enum=0 is also the default for non-enum fields, so the
// enum only counts when its size matches the array.
function indexNames(ddl, field) {
  const e = field.enum >= 0 ? ddl.enums[field.enum] : null;
  return e && field.array > 1 && e.names.length === field.array ? e.names : null;
}

class Stats {
  constructor(bytes, ddl) {
    this.data = bytes.subarray(HEADER_SIZE + STATS_HEADER_SIZE, HEADER_SIZE + STATS_SIZE);
    this.ddl = ddl;
  }

  // Little endian bit stream, LSB first (ddl_read_bits in src/utils.c).
  bits(bit, count) {
    if (count > 32) {
      let value = 0n;
      for (let i = 0; i < count; i++) {
        const b = bit + i;
        value |= BigInt((this.data[b >> 3] >> (b & 7)) & 1) << BigInt(i);
      }
      return value;
    }
    let value = 0;
    for (let i = 0; i < count; i++) {
      const b = bit + i;
      value += ((this.data[b >> 3] >> (b & 7)) & 1) * 2 ** i;
    }
    return value;
  }

  // Bit of a field; indices are consumed by every array along the path, outermost first.
  bitOf(path, indices) {
    const parts = path.split(".");
    let offset = 0;
    let next = 0;
    for (let i = 2; i <= parts.length; i++) {
      const field = this.ddl.fields.get(parts.slice(0, i).join("."));
      if (field.array > 1 && next < indices.length) {
        offset += indices[next++] * field.element;
      }
    }
    return this.ddl.fields.get(path).bit + offset;
  }

  // Leaf value; numbers for up to 32 bits, BigInt above, strings for type 5.
  get(path, ...indices) {
    const field = this.ddl.fields.get("root." + path);
    if (!field) {
      throw new Error("unknown DDL field " + path);
    }
    const bit = this.bitOf(field.path, indices);
    if (field.type === 5) {
      let text = "";
      for (let i = 0; i < field.element / 8; i++) {
        const c = this.bits(bit + i * 8, 8);
        if (!c) {
          break;
        }
        text += String.fromCharCode(c);
      }
      return text;
    }
    const value = this.bits(bit, field.element);
    if (field.type === 1 && field.element === 16 && value >= 0x8000) {
      return value - 0x10000; // short
    }
    return value;
  }

  playerStat(name) {
    const index = this.ddl.enums[0].names.indexOf(name);
    return index < 0 ? 0 : this.get("playerstatslist", index);
  }

  // Every leaf under path as [label, value], expanding arrays with their index names.
  *leaves(path, label = path.slice(5), indices = []) {
    if (HIDDEN_PATHS.has(path)) {
      return;
    }
    const field = this.ddl.fields.get(path);
    const names = indexNames(this.ddl, field);
    const count = field.array;
    for (let i = 0; i < count; i++) {
      if (path === "root.playerstatslist" && HIDDEN_PLAYER_STATS.has(i)) {
        continue;
      }
      const here = count > 1 ? [...indices, i] : indices;
      const index = path === "root.itemstats" ? `${i} ${itemName(i)}` : names ? names[i] : i;
      const name = count > 1 ? `${label}[${index}]` : label;
      const kids = this.ddl.children.get(path);
      if (kids) {
        for (const kid of kids) {
          yield* this.leaves(kid, name + kid.slice(kid.lastIndexOf(".")), here);
        }
        continue;
      }
      yield [name, this.get(path.slice(5), ...here)];
    }
  }
}

// --- Header ---------------------------------------------------------------------------

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes, crc = 0) {
  crc = ~crc >>> 0;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return ~crc >>> 0;
}

function cString(bytes) {
  const end = bytes.indexOf(0);
  return new TextDecoder("latin1").decode(end < 0 ? bytes : bytes.subarray(0, end));
}

function readHeader(bytes) {
  if (bytes.length < HEADER_SIZE) {
    throw new Error("File is too short for a stats file header.");
  }
  const view = new DataView(bytes.buffer, bytes.byteOffset);
  const magic = cString(bytes.subarray(0, 4));
  if (magic !== "SLST") {
    throw new Error("Not a Silinium stats file (magic is not SLST).");
  }
  const header = {
    version: view.getUint32(4), statsSize: view.getUint32(8),
    flags: view.getUint32(12), crc: view.getUint32(16),
    clan: cString(bytes.subarray(20, 52)),
    classes: CLASS_SLOTS.map((_, i) => cString(bytes.subarray(52 + i * 16, 68 + i * 16))),
  };
  if (header.version !== FILE_VERSION) {
    throw new Error(`Unsupported file version ${header.version} (expected ${FILE_VERSION}).`);
  }
  if (header.statsSize !== STATS_SIZE || bytes.length < HEADER_SIZE + STATS_SIZE) {
    throw new Error("Stats size does not match game version 1.13, or the file is truncated.");
  }
  const copy = bytes.slice(0, HEADER_SIZE);
  copy.fill(0, 16, 20);
  header.crcOk = crc32(bytes.subarray(HEADER_SIZE, HEADER_SIZE + STATS_SIZE), crc32(copy)) === header.crc;
  return header;
}

// --- Formatting -----------------------------------------------------------------------

const LOCALE = "de-DE";
const nf = new Intl.NumberFormat(LOCALE);
const fmt = (n) => nf.format(n);
const decimalFormats = new Map();
function dec(n, digits) {
  if (!decimalFormats.has(digits)) {
    decimalFormats.set(digits, new Intl.NumberFormat(LOCALE,
      { minimumFractionDigits: digits, maximumFractionDigits: digits }));
  }
  return decimalFormats.get(digits).format(n);
}
// Non-breaking space keeps "12,3 %" on one line.
const percent = (n) => dec(n, 1) + " %";
const ratio = (a, b) => b ? dec(a / b, 2) : a ? "∞" : "–";
const pct = (a, b) => b ? percent(100 * a / b) : "–";
function duration(seconds) {
  const d = Math.floor(seconds / 86400);
  const h = Math.floor(seconds % 86400 / 3600);
  const m = Math.floor(seconds % 3600 / 60);
  return d ? `${fmt(d)}d ${h}h ${m}m` : h ? `${h}h ${m}m` : `${m}m`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// --- Rendering ------------------------------------------------------------------------

function tile(k, v, s = "") {
  return `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ""}</div>`;
}

function section(title, body, note = "") {
  return `<section><h3>${esc(title)}${note ? `<span class="note">${esc(note)}</span>` : ""}</h3>${body}</section>`;
}

const tableShell = (id, extra = "") => `<div class="panel scroll ${extra}"><table id="${id}"><thead></thead><tbody></tbody></table></div>`;

// columns: [{key, label, fmt?, sortBy?, bar?, noBar?}]; a bar column draws the sorted column
// relative to its maximum, or its own key when that column is not numeric or marked noBar.
const tables = new Map();

function barKeyFor(columns, rows, sortKey) {
  const barColumn = columns.find((c) => c.bar);
  if (!barColumn) {
    return null;
  }
  const sorted = columns.find((c) => !c.bar && (c.sortBy || c.key) === sortKey);
  const numeric = rows.some((r) => typeof r[sortKey] === "number");
  return sorted && !sorted.noBar && numeric ? sortKey : barColumn.key;
}
function setupTable(id, columns, rows, sortKey) {
  const el = document.getElementById(id);
  el.tHead.innerHTML = "<tr>" + columns.map((c) => c.key === "label" || c.bar
    ? `<th>${esc(c.label)}</th>`
    : `<th class="sortable" data-key="${c.sortBy || c.key}">${esc(c.label)}</th>`).join("") + "</tr>";
  el.querySelectorAll("th.sortable").forEach((th) => {
    th.onclick = () => {
      tables.get(id).sortKey = th.dataset.key;
      renderTable(id);
    };
  });
  tables.set(id, { columns, rows, sortKey });
  renderTable(id);
}

function renderTable(id) {
  const { columns, rows, sortKey } = tables.get(id);
  const el = document.getElementById(id);
  const sorted = [...rows].sort((a, b) => typeof a[sortKey] === "string"
    ? a[sortKey].localeCompare(b[sortKey]) : (b[sortKey] ?? 0) - (a[sortKey] ?? 0));
  const barKey = barKeyFor(columns, rows, sortKey);
  const max = barKey ? Math.max(1, ...rows.map((r) => r[barKey] ?? 0)) : 1;
  el.querySelectorAll("th.sortable").forEach((th) => th.classList.toggle("sorted", th.dataset.key === sortKey));
  el.tBodies[0].innerHTML = sorted.map((r) => "<tr>" + columns.map((c) => {
    if (c.bar) {
      return `<td class="barcell"><div style="width:${(100 * (r[barKey] ?? 0) / max).toFixed(1)}%"></div></td>`;
    }
    const value = c.fmt ? c.fmt(r) : r[c.key];
    return `<td class="${c.key === "label" ? "" : "mono"}">${esc(typeof value === "number" ? fmt(value) : value)}</td>`;
  }).join("") + "</tr>").join("");
}

  }
  const recent = rows.length ? `<div class="panel scroll"><table><thead><tr><th>Slot</th><th>Score</th>
    <th>Kills</th><th>Deaths</th><th>K/D</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
    : `<p class="footnote">No recent matches stored.</p>`;

  const a = (f) => s.get("afteractionreportstats." + f);
  let last = `<p class="footnote">No after-action report stored.</p>`;
  if (a("valid")) {
    const entries = [
      ["Score", fmt(a("score"))], ["Kills", fmt(a("kills"))], ["Deaths", fmt(a("deaths"))],
      ["Headshots", fmt(a("headshots"))], ["Best streak", fmt(a("bestkillstreak"))],
      ["XP earned", fmt(a("xpearned"))], ["CP earned", fmt(a("cpearned"))],
      ["Match bonus", fmt(a("matchbonus"))], ["Top weapon", `${itemName(a("topweaponitemindex"))} (${fmt(a("topweaponkills"))} kills)`],
      ["Nemesis", a("nemesisname") || "–"],
      ["Kills on nemesis", fmt(a("nemesiskills"))], ["Killed by nemesis", fmt(a("nemesiskilledby"))],
      ["Private match", a("privatematch") ? "yes" : "no"],
    ];
    last = `<div class="panel"><table><tbody>${entries.map(([k, v]) =>
      `<tr><td class="dim">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `<div class="two"><div>${recent}</div><div>${last}</div></div>`;
}

function renderSearchList(id, placeholder, withZeroToggle) {
  return `<div class="panel">
    <div class="toolbar">
      <input type="search" id="${id}-q" placeholder="${esc(placeholder)}">
      ${withZeroToggle ? `<label class="check"><input type="checkbox" id="${id}-zero"> show zeros</label>` : ""}
      <span class="count" id="${id}-count"></span>
    </div>
    <div class="tall"><table><tbody id="${id}-body"></tbody></table></div>
  </div>`;
}

// entries: [label, value]; renders at most limit matches to keep the DOM small.
function bindSearchList(id, entries, limit = 800) {
  const q = document.getElementById(id + "-q");
  const zero = document.getElementById(id + "-zero");
  const body = document.getElementById(id + "-body");
  const count = document.getElementById(id + "-count");
  const update = () => {
    const needle = q.value.trim().toLowerCase();
    const showZero = !zero || zero.checked;
    const hits = entries.filter(([k, v]) => (showZero || (v !== 0 && v !== 0n && v !== "")) &&
      (!needle || k.toLowerCase().includes(needle)));
    count.textContent = hits.length > limit ? `${limit} of ${fmt(hits.length)}` : `${fmt(hits.length)} fields`;
    body.innerHTML = hits.slice(0, limit).map(([k, v]) =>
      `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(typeof v === "string" ? JSON.stringify(v) : fmt(v))}</td></tr>`).join("");
  };
  q.oninput = update;
  if (zero) {
    zero.onchange = update;
  }
  update();
}

function render(name, bytes, ddl) {
  const header = readHeader(bytes);
  const s = new Stats(bytes, ddl);

  const groups = ddl.enums[6].names;
  const groupRows = weaponRows(s, "groupstats", groups.length,
    (i) => groupName(groups[i]));
  const itemRows = weaponRows(s, "itemstats", ddl.fields.get("root.itemstats").array, itemName)
    .filter((r) => WEAPON_TYPES.has(itemType(r.index)));
  for (const r of itemRows) {
    r.type = itemType(r.index);
  }
  for (const r of [...groupRows, ...itemRows]) {
    r.accValue = r.shots ? r.hits / r.shots : 0;
  }

  const playerStats = [...s.leaves("root.playerstatslist")]
    .map(([k, v]) => [k.replace(/^playerstatslist\[|\]$/g, ""), v]);
  const raw = [];
  for (const path of ddl.children.get("root")) {
    raw.push(...s.leaves(path));
  }

  document.getElementById("out").innerHTML = [
    renderHero(name, header, s),
    section("Career", renderOverview(s)),
    section("Personal bests", renderBests(s)),
    section("Game modes", tableShell("modes")),
    section("Weapon groups", tableShell("groups")),
    section("Weapons", tableShell("weapons", "tall")),
    section("Killstreaks", renderKillstreakTiles(s) + tableShell("killstreaks")),
    section("Contracts", renderContracts(s), "contract names are not in the file"),
    section("Classes", renderClasses(header, s), "hover an item for its statsTable id"),
    section("Recent matches & last match", renderMatches(s)),
    section("All player stats", renderSearchList("ps", "Search playerstatslist…", false)),
    section("Raw DDL", renderSearchList("raw", "Search every field, e.g. emblemstats or L96A1", true),
      "account and console fields are cleared on save and hidden"),
  ].join("");

  const modeColumns = [
    { key: "label", label: "Mode" },
    { key: "kills", label: "Kills" },
    { key: "deaths", label: "Deaths" },
    { key: "kdText", label: "K/D", sortBy: "kd", fmt: (r) => ratio(r.kills, r.deaths) },
    { key: "wins", label: "Wins" },
    { key: "losses", label: "Losses" },
    { key: "score", label: "Score" },
    { key: "timeText", label: "Time", sortBy: "time", fmt: (r) => duration(r.time) },
    { key: "time", label: "", bar: true },
  ];
  setupTable("modes", modeColumns, modeRows(s), "time");
  setupTable("groups", WEAPON_COLUMNS, groupRows, "kills");
  setupTable("weapons", ITEM_COLUMNS, itemRows, "kills");
  setupTable("killstreaks", KILLSTREAK_COLUMNS, killstreakRows(s), "used");
  setupTable("contracts", CONTRACT_COLUMNS, contractRows(s), "purchased");
  bindSearchList("ps", playerStats);
  bindSearchList("raw", raw);
}

// --- Loading --------------------------------------------------------------------------

const ddl = parseDdl(document.getElementById("ddl").textContent);
const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const errorBox = document.getElementById("error");

async function load(file) {
  errorBox.hidden = true;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    render(file.name.replace(/\.bin$/i, ""), bytes, ddl);
    drop.hidden = true;
  } catch (e) {
    document.getElementById("out").innerHTML = "";
    drop.hidden = false;
    errorBox.textContent = e.message;
    errorBox.hidden = false;
  }
}

document.getElementById("open").onclick = () => fileInput.click();
document.getElementById("open2").onclick = () => fileInput.click();
fileInput.onchange = () => fileInput.files[0] && load(fileInput.files[0]);
document.addEventListener("dragover", (e) => {
  e.preventDefault();
  drop.classList.add("over");
});
document.addEventListener("dragleave", () => drop.classList.remove("over"));
document.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) {
    load(e.dataTransfer.files[0]);
  }
});
</script>
