name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check clang-format
        uses: jidicula/clang-format-action@v4.15.0
        with:
          clang-format-version: '20'
          check-path: 'src'

  build:
    runs-on: windows-latest
    needs: format

    strategy:
      matrix:
        config: [ debug, release ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PS3 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/itacentury/T5GSCLoader/releases/download/ps3sdk/ps3sdk.zip" -OutFile ps3sdk.zip
          Expand-Archive ps3sdk.zip -DestinationPath D:\ps3sdk
          Write-Output "SCE_PS3_ROOT=D:/ps3sdk" >> $Env:GITHUB_ENV

      - name: Build
        shell: bash
        run: ./build.sh ${{ matrix.config }}

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: Silinium-${{ matrix.config }}
          path: bin/${{ matrix.config }}/Silinium.sprx
